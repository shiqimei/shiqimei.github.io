<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="430" viewBox="70 0 1060 430" role="img" aria-labelledby="title desc">
  <title id="title">Capabilities, not credentials</title>
  <desc id="desc">The agent can define a scoped capability while the credential stays inside the trusted Runta boundary and is injected only for an approved destination.</desc>
  <rect x="70" width="1060" height="430" fill="#000"/>
  <g font-family="SFMono-Regular, SF Mono, JetBrains Mono, monospace">
    <g transform="translate(70 190)">
      <rect width="220" height="120" fill="#050505" stroke="#555" stroke-width="2"/>
      <text x="110" y="52" fill="#fff" font-size="24" text-anchor="middle" font-weight="600">AGENT</text>
      <text x="110" y="84" fill="#aaa" font-size="17" text-anchor="middle">defines access</text>
    </g>

    <g transform="translate(470 160)">
      <rect width="260" height="180" fill="#080808" stroke="#ff6e1a" stroke-width="3"/>
      <image href="data:image/png;base64," x="94" y="24" width="92" height="96" preserveAspectRatio="xMidYMid meet"/>
      <text x="130" y="142" fill="#fff" font-size="25" text-anchor="middle" font-weight="600">RUNTA</text>
    </g>

    <g transform="translate(910 190)">
      <rect width="220" height="120" fill="#050505" stroke="#555" stroke-width="2"/>
      <text x="110" y="52" fill="#fff" font-size="23" text-anchor="middle" font-weight="600">EXTERNAL API</text>
      <text x="110" y="84" fill="#aaa" font-size="17" text-anchor="middle">receives secret</text>
    </g>

    <line x1="290" y1="250" x2="470" y2="250" stroke="#777" stroke-width="4"/>
    <polygon points="470,250 448,238 448,262" fill="#777"/>
    <line x1="730" y1="250" x2="910" y2="250" stroke="#777" stroke-width="4"/>
    <polygon points="910,250 888,238 888,262" fill="#777"/>

    <line x1="600" y1="94" x2="600" y2="160" stroke="#ff6e1a" stroke-width="4"/>
    <polygon points="600,160 588,138 612,138" fill="#ff6e1a"/>
    <text x="600" y="66" fill="#fff" font-size="20" text-anchor="middle" font-weight="600">HUMAN ENTERS SECRET</text>

    <text x="600" y="397" fill="#ff6e1a" font-size="20" text-anchor="middle" font-weight="600">SECRET NEVER REACHES THE AGENT</text>
  </g>
</svg>
